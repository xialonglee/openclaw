title: Matrix prototype-named msgtypes stay plain text in live thread context
scenario:
  id: matrix-proto-msgtype-thread-context
  surface: channels
  coverage:
    primary:
      - matrix.message-presentation-metadata
  objective: Verify that a room message whose remote-controlled msgtype collides with an Object.prototype property name renders as plain text when the gateway summarizes the thread root for the agent, while a legitimate m.image attachment still renders its attachment marker.
  successCriteria:
    - Hostile-msgtype thread roots reach the recorded model input as plain text without corrupted media markers.
    - A legitimate m.image thread root still renders the [matrix image attachment] marker in agent-visible thread context.
  docsRefs:
    - docs/channels/matrix.md
  codeRefs:
    - extensions/matrix/src/matrix/media-text.ts
    - extensions/matrix/src/matrix/monitor/thread-context.ts
  execution:
    kind: flow
    channel: matrix
    timeoutMs: 240000
    retryCount: 0
    config:
      matrixTopology:
        defaultRoomKey: main
        rooms:
          - encrypted: false
            key: proto
            kind: group
            members:
              - driver
              - observer
              - sut
            name: Matrix QA Proto Msgtype Room
            requireMention: true

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-proto-msgtype.js
  call: runProtoMsgtypeThreadContextScenario
  args:
    - expr: "scenarioContext"
