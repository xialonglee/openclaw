name: Proof matrix msgtype prototype keys

on:
  push:
    branches: [fix/gap-matrix-msgtype-proto-keys-proof]

permissions: {}

jobs:
  proof:
    name: proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BEFORE_SHA: f9f4aa93646e74a0b63ae667d1d57ed5455f7e07
      AFTER_SHA: 6f7efd2caea7d34a60b2a2b44b2d45bbfb982afa
      CI: true
      OPENCLAW_SKIP_UPDATE_CHECK: 1

    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      - name: Fetch immutable source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/proof-source"
          mkdir -p "$source_dir"
          cd "$source_dir"
          git init
          git remote add origin https://github.com/openclaw/openclaw.git
          git fetch --depth=1 origin "$BEFORE_SHA"
          git fetch --depth=1 origin "$AFTER_SHA"

      - name: Write proof driver
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/proof.mts" <<'EOF'
          // Feeds prototype-named msgtypes through the real Matrix summary and
          // context entrypoints; prints one compact line per scene.
          const repo = process.env.REPO_DIR;
          const { summarizeMatrixRawEvent } = await import(`${repo}/extensions/matrix/src/matrix/actions/summary.js`);
          const { summarizeMatrixMessageContextEvent } = await import(`${repo}/extensions/matrix/src/matrix/monitor/context-summary.js`);

          function mkEvent(msgtype: string, body = "hi", filename?: string) {
            return {
              event_id: "$proof1",
              sender: "@peer:example.org",
              type: "m.room.message",
              origin_server_ts: 1725000000000,
              content: { body, msgtype, ...(filename ? { filename } : {}) },
            };
          }

          function kindLabel(kind: unknown): string {
            return typeof kind === "string" ? kind : `<inherited:${typeof kind}>`;
          }

          const scenes = [
            { name: "summary-proto", msgtype: "__proto__" },
            { name: "summary-constructor", msgtype: "constructor" },
            { name: "summary-toString", msgtype: "toString" },
            { name: "control-image", msgtype: "m.image", filename: "photo.png" },
          ];

          for (const scene of scenes) {
            const summary = summarizeMatrixRawEvent(mkEvent(scene.msgtype, "hi", scene.filename) as never);
            console.log(
              `scene=${scene.name} entry=summary attachment=${summary.attachment ? 1 : 0} kind=${summary.attachment ? kindLabel(summary.attachment.kind) : "-"} body=${JSON.stringify(summary.body)}`,
            );
            const contextText = summarizeMatrixMessageContextEvent(mkEvent(scene.msgtype, "hi", scene.filename) as never);
            console.log(`scene=${scene.name} entry=context text=${JSON.stringify(contextText)}`);
          }
          EOF

      - name: Install dependencies (before)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          git checkout --detach "$BEFORE_SHA"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile

      - name: Prove before fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          REPO_DIR="$RUNNER_TEMP/proof-source" node --import tsx "$RUNNER_TEMP/proof.mts" 2>&1 | tee "$RUNNER_TEMP/proof-before.log"

      - name: Install dependencies (after)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          git checkout --detach "$AFTER_SHA"
          pnpm install --frozen-lockfile

      - name: Prove after fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          REPO_DIR="$RUNNER_TEMP/proof-source" node --import tsx "$RUNNER_TEMP/proof.mts" 2>&1 | tee "$RUNNER_TEMP/proof-after.log"

      - name: Verdict
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/proof-before.log"
          after="$RUNNER_TEMP/proof-after.log"

          fail=0
          check() {
            local scene="$1" file="$2" pattern="$3"
            if grep -qF "$pattern" "$file"; then
              echo "[proof] scene=$scene status=pass detail=$pattern"
            else
              echo "[proof] scene=$scene status=FAIL expected-in-$(basename "$file"): $pattern"
              fail=1
            fi
          }

          # BEFORE: prototype-named msgtypes misclassified as media with inherited values
          check summary-proto-before "$before" 'scene=summary-proto entry=summary attachment=1 kind=<inherited:object>'
          check summary-constructor-before "$before" 'scene=summary-constructor entry=summary attachment=1 kind=<inherited:function>'
          check summary-toString-before "$before" 'scene=summary-toString entry=summary attachment=1 kind=<inherited:function>'
          check context-proto-before "$before" 'scene=summary-proto entry=context text="hi\n\n[matrix [object Object] attachment]"'
          check context-constructor-before "$before" 'scene=summary-constructor entry=context text="hi\n\n[matrix function Object() { [native code] } attachment]"'

          # AFTER: prototype-named msgtypes stay plain text, no attachment
          check summary-proto-after "$after" 'scene=summary-proto entry=summary attachment=0 kind=- body="hi"'
          check summary-constructor-after "$after" 'scene=summary-constructor entry=summary attachment=0 kind=- body="hi"'
          check summary-toString-after "$after" 'scene=summary-toString entry=summary attachment=0 kind=- body="hi"'
          check context-proto-after "$after" 'scene=summary-proto entry=context text="hi"'
          check context-constructor-after "$after" 'scene=summary-constructor entry=context text="hi"'

          # CONTROL: legitimate attachment behavior unchanged in both
          check control-image-before "$before" 'scene=control-image entry=summary attachment=1 kind=image'
          check control-image-after "$after" 'scene=control-image entry=summary attachment=1 kind=image'
          check control-context-before "$before" 'scene=control-image entry=context text="hi\n\n[matrix image attachment]"'
          check control-context-after "$after" 'scene=control-image entry=context text="hi\n\n[matrix image attachment]"'

          grep -c 'status=pass' "$before" "$after" 2>/dev/null || true
          if [ "$fail" -ne 0 ]; then
            echo "[proof] VERDICT: FAIL"
            exit 1
          fi
          echo "[proof] VERDICT: PASS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: proof-matrix-msgtype-proto-keys
          path: |
            ${{ runner.temp }}/proof-before.log
            ${{ runner.temp }}/proof-after.log
          retention-days: 30
