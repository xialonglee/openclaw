name: Proof compact static catalog (PR #123432)

on:
  push:
    branches: [fix/gap-compact-static-catalog-proof]

permissions: {}

jobs:
  proof:
    name: before/after real-gateway proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BEFORE_SHA: 1605dbd3efef1c10da95c4a9bbb51a19a9d07865
      AFTER_SHA: e65b454c1ce5409b89ea17053cf44e5115005d85
      CI: true
      OPENCLAW_SKIP_UPDATE_CHECK: 1
      OPENCLAW_E2E_VERBOSE: 1

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: fix/gap-compact-static-catalog-proof
          path: proof-branch

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      # ① Fetch immutable BEFORE/AFTER SHAs from the canonical repo.
      - name: Fetch immutable BEFORE/AFTER source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/proof-source"
          mkdir -p "$source_dir"
          cd "$source_dir"
          git init
          git remote add origin https://github.com/openclaw/openclaw.git
          git fetch --depth=1 origin "$BEFORE_SHA"
          git fetch --depth=1 origin "$AFTER_SHA"

      # ② Install dependencies at BEFORE_SHA.
      - name: Install dependencies (before)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          git checkout --detach "$BEFORE_SHA"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile

      # ③ Run the real-gateway proof against BEFORE_SHA. The e2e global setup
      #    builds the dist the Gateway server lazily imports.
      - name: Prove BEFORE (real gateway, static mechanism baseline)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          cp "$GITHUB_WORKSPACE/proof-branch/test/compact-static-catalog.real-gateway-proof.e2e.test.ts" \
             test/compact-static-catalog.real-gateway-proof.e2e.test.ts
          PROOF_MODE=before npx vitest run \
            --config test/vitest/vitest.e2e.config.ts \
            test/compact-static-catalog.real-gateway-proof.e2e.test.ts \
            2>&1 | tee "$RUNNER_TEMP/proof-before.log"
          echo ""
          echo "=== BEFORE markers ==="
          grep -F '[proof]' "$RUNNER_TEMP/proof-before.log"
          echo "=== BEFORE assertions ==="
          grep -F '[proof] scene=live-acquire mode=before' "$RUNNER_TEMP/proof-before.log" \
            | grep -F 'status=pass' | grep -E 'ensure_calls=[1-9]'
          grep -F '[proof] scene=default-acquire mode=before' "$RUNNER_TEMP/proof-before.log" \
            | grep -F 'status=pass' | grep -F 'expected_discovery=true' | grep -E 'ensure_calls=[1-9]'
          grep -F '[proof] scene=partial-acquire mode=before' "$RUNNER_TEMP/proof-before.log" \
            | grep -F 'status=pass' | grep -F 'expected_discovery=true' | grep -E 'ensure_calls=[1-9]'
          grep -F '[proof] scene=gateway-call mode=before' "$RUNNER_TEMP/proof-before.log" \
            | grep -F 'status=pass' | grep -F 'run_wait=ok'

      # ④ Install dependencies at AFTER_SHA.
      - name: Install dependencies (after)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          git checkout --detach "$AFTER_SHA"
          pnpm install --frozen-lockfile

      # ⑤ Run the real-gateway proof against AFTER_SHA.
      - name: Prove AFTER (real gateway, callers now static)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof-source"
          cp "$GITHUB_WORKSPACE/proof-branch/test/compact-static-catalog.real-gateway-proof.e2e.test.ts" \
             test/compact-static-catalog.real-gateway-proof.e2e.test.ts
          PROOF_MODE=after npx vitest run \
            --config test/vitest/vitest.e2e.config.ts \
            test/compact-static-catalog.real-gateway-proof.e2e.test.ts \
            2>&1 | tee "$RUNNER_TEMP/proof-after.log"
          echo ""
          echo "=== AFTER markers ==="
          grep -F '[proof]' "$RUNNER_TEMP/proof-after.log"
          echo "=== AFTER assertions ==="
          grep -F '[proof] scene=live-acquire mode=after' "$RUNNER_TEMP/proof-after.log" \
            | grep -F 'status=pass' | grep -E 'ensure_calls=[1-9]'
          grep -F '[proof] scene=default-acquire mode=after' "$RUNNER_TEMP/proof-after.log" \
            | grep -F 'status=pass' | grep -F 'expected_discovery=false' | grep -F 'ensure_calls=0'
          grep -F '[proof] scene=partial-acquire mode=after' "$RUNNER_TEMP/proof-after.log" \
            | grep -F 'status=pass' | grep -F 'expected_discovery=false' | grep -F 'ensure_calls=0'
          grep -F '[proof] scene=gateway-call mode=after' "$RUNNER_TEMP/proof-after.log" \
            | grep -F 'status=pass' | grep -F 'run_wait=ok'

      # ⑥ Collect the proof summary and upload it as the evidence artifact.
      - name: Collect proof summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof-logs"
          cp "$RUNNER_TEMP/proof-before.log" "$RUNNER_TEMP/proof-logs/" 2>/dev/null || true
          cp "$RUNNER_TEMP/proof-after.log" "$RUNNER_TEMP/proof-logs/" 2>/dev/null || true
          {
            echo "BEFORE_SHA=$BEFORE_SHA"
            echo "AFTER_SHA=$AFTER_SHA"
            echo ""
            echo "=== BEFORE markers ==="
            grep -F '[proof]' "$RUNNER_TEMP/proof-before.log" 2>/dev/null || true
            echo ""
            echo "=== AFTER markers ==="
            grep -F '[proof]' "$RUNNER_TEMP/proof-after.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/proof-logs/summary.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: proof-compact-static-catalog
          path: |
            ${{ runner.temp }}/proof-logs/
          retention-days: 30
